name: release
on:
  push:
    branches: [main]

permissions:
  contents: write # allow tag + release
  pull-requests: write # allow the bot to open/refresh PRs
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
          # PAT required so the release PR is authored by a user account.
          # GitHub suppresses pull_request workflow triggers on events created
          # by GITHUB_TOKEN, leaving the required Build check un-run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
